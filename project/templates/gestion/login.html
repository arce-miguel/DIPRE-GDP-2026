{% extends 'gestion/base.html' %}
{% load static %}
{% block title %}{{ titulo_login }}{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-back-box">
            <a href="{% url 'index' %}" class="login-back-link">← VOLVER A SELECCIÓN</a>
        </div>
        <div class="login-img-box">
            <img src="{% static 'gestion/images/Dipre.png' %}" class="login-img">
        </div>
        
        <h2 class="login-title">{{ titulo_login }}</h2>
        <p class="login-subtitle">{{ subtitulo }}</p>

        <form method="post">
            {% csrf_token %}
            <div class="login-input-group">
                <label>Número Control</label>
                <input class="uspas" type="text" id="username" name="username" placeholder="Numero de control" required />
            </div>
            
            <div class="login-input-group">
                <label>Contraseña</label>
                <input class="uspas" type="password" id="password" name="password" placeholder="********" required />
            </div>
            <div class="login-submit-btn-class">
                <button type="submit" class="login-submit-btn">Iniciar Sesión</button>
                
            </div>
            
        </form>
        <form method="get" action="{% url 'enc-dash' %}"> 
            <button type="submit" class="login-submit-btn">PARA HACER PRUEBAS</button>
        </form>
    </div>
</div>

{% endblock %}
