{% extends 'gestion/base.html' %}

{% block title %}{{ titulo_login }}{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 p-4 rounded-4 bg-white">
            <div class="mb-3">
                <a href="{% url 'index' %}" class="text-decoration-none text-muted small">← Volver a selección</a>
            </div>

            <h2 class="fw-bold text-dark mb-1">{{ titulo_login }}</h2>
            <p class="text-muted small mb-4">{{ subtitulo }}</p>

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Usuario / Correo</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Iniciar Sesión</button>
            </form>
            
        </div>
    </div>
</div>
{% endblock %}
