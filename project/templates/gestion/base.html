<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Préstamos{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'gestion/css/styles.css' %}">
    <link rel="icon" href="{% static 'gestion/images/icon.ico' %}" type="image/x-icon">
</head>
<body>
    <nav class="navbar-custom" href="{% url 'index'} %">
        <div>
            <img src="{% static 'gestion/images/LogoDipre.png' %}" alt="LOGO" class="logo-img">
        </div>
    </nav>

    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer-custom">
        <div>
            <p>Sistema de Control de Préstamos e Inventario</p>
            <p>&copy; 2026 - Derechos reservados DIPRE asociados y Jose</p>
        </div>
    </footer>

</html>
